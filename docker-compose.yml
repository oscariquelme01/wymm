services:
  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: wymm
      TZ: Europe/Madrid
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d wymm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Madrid
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wymm
      DB_USERNAME: user
      DB_PASSWORD: user
      CLASSIFIER_URL: ${CLASSIFIER_URL:-http://ml-classifier:8000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    depends_on:
      - api

  ml-classifier:
    ports:
      - "8000:8000"

volumes:
  postgres-data:
