version: '3.9'
services:
  postgres:
    image: postgres:14
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: wymm
      TZ: Europe/Madrid
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wymm
      DB_USERNAME: user
      DB_PASSWORD: user
    depends_on:
      postgres:
        condition: service_started
