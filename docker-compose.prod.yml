services:
  api:
    build:
      context: ./api-node
      dockerfile: docker/Dockerfile
    env_file:
      - ./env/.env.prod
    environment:
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"

  ml-classifier:
    build:
      context: ./ml-classifier-python
      dockerfile: Dockerfile
    env_file:
      - ./env/.env.prod
